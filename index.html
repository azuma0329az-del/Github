<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アラビア語単語クイズ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f5f9;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .quiz-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 440px;
            margin: 10px auto;
        }
        
        /* 理解度の可視化エリア */
        .progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }
        .progress-bar-container {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin: 6px 0;
        }
        .bar-mastered { background: #22c55e; }
        .bar-review { background: #eab308; }
        .bar-weak { background: #ef4444; }
        .bar-unattempted { background: #cbd5e1; }
        .stats-text {
            display: flex;
            justify-content: space-around;
            color: #475569;
            font-weight: bold;
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .page-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .rate-badge {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .rate-high { background-color: #dcfce7; color: #15803d; }
        .rate-mid { background-color: #fef9c3; color: #a16207; }
        .rate-low { background-color: #fee2e2; color: #b91c1c; }

        .mode-title {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 4px;
            margin-top: 10px;
        }
        .question-text {
            font-size: 2.3rem;
            color: #0f172a;
            margin: 10px 0;
            min-height: 55px;
            word-break: break-all;
        }
        .pronunciation-text {
            font-size: 1.1rem;
            color: #0284c7;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .option-btn.pass-btn {
            grid-column: span 2;
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #cbd5e1;
        }
        .option-btn:hover { background-color: #f8fafc; }
        .option-btn.correct { background-color: #22c55e !important; color: white !important; border-color: #16a34a !important; }
        .option-btn.wrong { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }

        .input-box {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn {
            padding: 10px 20px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .skip-btn {
            padding: 10px 16px;
            background-color: #64748b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 30px;
        }
        .next-btn {
            margin-top: 15px;
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<div class="quiz-container">

        <div class="progress-bar-container">

            <div id="bar-weak" class="bar-weak" style="width: 0%"></div>
            <div id="bar-unattempted" class="bar-unattempted" style="width: 100%"></div>
        </div>
        <div class="stats-text">

            <span>苦手: <span id="count-weak">0</span></span>
            <span>復習: <span id="count-review">0</span></span>
            <span>習得: <span id="count-mastered">0</span></span>
        </div>
    </div>

    <div class="badge-container">
        <span class="page-badge" id="page-badge">P.1</span>
        <span class="rate-badge rate-low" id="rate-badge">未判定</span>
    </div>

    <div class="mode-title" id="mode-title">出題モード</div>
    <div class="question-text" id="question-word">...</div>
    <div class="pronunciation-text" id="pronunciation-word"></div>

    <div id="interactive-area"></div>

    <div class="feedback" id="feedback-msg"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ ➔</button>
</div>

    { ar: "ظبي", pr: "ザビイ", jp: "レイヨウ", p: 29 }, { ar: "ظلمة", pr: "ズルマ", jp: "暗闇", p: 29 },
    { ar: "مظلة", pr: "ミザッラ", jp: "傘", p: 30 }, { ar: "بيض", pr: "バイド", jp: "卵", p: 30 },
    { ar: "ظرف", pr: "ザルフ", jp: "封筒", p: 30 }, { ar: "حافلة", pr: "ハーフィラ", jp: "バス", p: 30 },
    { ar: "ضابط", pr: "ザービト", jp: "警察官", p: 30 }, { ar: "ظفر", pr: "ズフル", jp: "爪", p: 30 },
    { ar: "عضلات", pr: "アザラート", jp: "筋肉", p: 30 },

    // P.31 - P.35
    { ar: "عرس", pr: "ウルス", jp: "結婚式", p: 31 }, { ar: "ضرس", pr: "ジルズ", jp: "奥歯", p: 31 },
    { ar: "ضفدع", pr: "ジフダア", jp: "カエル", p: 31 }, { ar: "يغسل", pr: "ヤグシル", jp: "洗う", p: 32 },
    { ar: "غواصة", pr: "ガッワーサ", jp: "潜水艦", p: 32 }, { ar: "عنكبوت", pr: "アンカブート", jp: "クモ", p: 32 },
    { ar: "يغرد", pr: "ユガルリド", jp: "さえずる", p: 32 }, { ar: "مربع", pr: "ムラッバア", jp: "正方形", p: 32 },
    { ar: "صمغ", pr: "サムグ", jp: "接着剤", p: 33 }, { ar: "بعوض", pr: "バウーズ", jp: "カ", p: 33 },
    { ar: "مصنع", pr: "マスナア", jp: "工場", p: 33 }, { ar: "غابة", pr: "ガーバ", jp: "森", p: 33 },
    { ar: "وعاء", pr: "ウィアー", jp: "容器", p: 34 }, { ar: "خيار", pr: "ヒヤール", jp: "キュウリ", p: 34 },
    { ar: "شارع", pr: "シャーリア", jp: "通り", p: 34 }, { ar: "قناع", pr: "キナーア", jp: "仮面", p: 34 },
    { ar: "تصوير", pr: "タスウィール", jp: "撮影", p: 35 }, { ar: "طعام", pr: "タアーム", jp: "食べ物", p: 35 },
    { ar: "مطبخ", pr: "マトバハ", jp: "台所", p: 35 }
];

let wordStats = {};
words.forEach((_, index) => {
    wordStats[index] = { correct: 0, total: 0 };
});

let currentIdx = null;
let currentWord = null;
let currentMode = "choice";
let correctAnswer = "";

function updateProgress() {
    let unattempted = 0;
    let weak = 0;
    let review = 0;
    let mastered = 0;

    words.forEach((_, idx) => {
        let stat = wordStats[idx];
        if (stat.total === 0) {
            unattempted++;
        } else {
            let rate = stat.correct / stat.total;
            if (rate < 0.4) weak++;
            else if (rate < 0.8) review++;
            else mastered++;
        }
    });

    const total = words.length;
    document.getElementById('count-unattempted').textContent = unattempted;
    document.getElementById('count-weak').textContent = weak;
    document.getElementById('count-review').textContent = review;
    document.getElementById('count-mastered').textContent = mastered;

    document.getElementById('bar-unattempted').style.width = `${(unattempted/total)*100}%`;
    document.getElementById('bar-weak').style.width = `${(weak/total)*100}%`;
    document.getElementById('bar-review').style.width = `${(review/total)*100}%`;
    document.getElementById('bar-mastered').style.width = `${(mastered/total)*100}%`;

    let percent = Math.round((mastered / total) * 100);
    document.getElementById('master-percent').textContent = `${percent}%`;
}

window.nextQuestion = function() {
    updateProgress();

    let weightedIndices = [];
    words.forEach((_, idx) => {
        let stat = wordStats[idx];
        let rate = stat.total === 0 ? 0 : stat.correct / stat.total;
        let weight = Math.ceil((1.1 - rate) * 10);
        for (let i = 0; i < weight; i++) {
            weightedIndices.push(idx);
        }
    });

    currentIdx = weightedIndices[Math.floor(Math.random() * weightedIndices.length)];
    currentWord = words[currentIdx];

    const stat = wordStats[currentIdx];
    const rate = stat.total === 0 ? -1 : (stat.correct / stat.total);

    const rateBadge = document.getElementById('rate-badge');
    if (rate === -1) {
        currentMode = "choice";
        rateBadge.textContent = "未挑戦 (4択)";
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.4) {
        currentMode = "choice";
        rateBadge.textContent = `正答率 ${(rate*100).toFixed(0)}% (4択)`;
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.8) {
        currentMode = "translate";
        rateBadge.textContent = `正答率 ${(rate*100).toFixed(0)}% (日本語入力)`;
        rateBadge.className = "rate-badge rate-mid";
    } else {
        currentMode = "write";
        rateBadge.textContent = `正答率 ${(rate*100).toFixed(0)}% (アラビア語入力)`;
        rateBadge.className = "rate-badge rate-high";
    }

    document.getElementById('page-badge').textContent = `P.${currentWord.p} (全${words.length}語)`;
    document.getElementById('feedback-msg').textContent = '';
    document.getElementById('next-btn').style.display = 'none';

    setupUI();
};

function setupUI() {
    const qElem = document.getElementById('question-word');
    const pElem = document.getElementById('pronunciation-word');
    const titleElem = document.getElementById('mode-title');
    const area = document.getElementById('interactive-area');
    area.innerHTML = '';

    if (currentMode === "choice") {
        titleElem.textContent = "【4択モード】正しい日本語を選んでください";
        qElem.textContent = currentWord.ar;
        qElem.style.direction = "rtl";
        pElem.textContent = `【発音: ${currentWord.pr}】`;
        correctAnswer = currentWord.jp;

        let choices = [currentWord.jp];
        while (choices.length < 4) {
            let rJp = words[Math.floor(Math.random() * words.length)].jp;
            if (!choices.includes(rJp)) choices.push(rJp);
        }
        choices.sort(() => Math.random() - 0.5);

        let grid = document.createElement('div');
        grid.className = 'options-grid';
        choices.forEach(choice => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = choice;
            btn.onclick = function() { checkAnswer(choice, btn); };
            grid.appendChild(btn);
        });

        // 「分からない」ボタンを追加
        let passBtn = document.createElement('button');
        passBtn.className = 'option-btn pass-btn';
        passBtn.textContent = "❓ 分からない (パス)";
        passBtn.onclick = function() { checkAnswer(null, passBtn); };
        grid.appendChild(passBtn);

        area.appendChild(grid);

    } else if (currentMode === "translate") {
        titleElem.textContent = "【中級モード】日本語訳を入力してください";
        qElem.textContent = currentWord.ar;
        qElem.style.direction = "rtl";
        pElem.textContent = `【発音: ${currentWord.pr}】`;
        correctAnswer = currentWord.jp;

        area.innerHTML = `
            <input type="text" id="user-input" class="input-box" placeholder="日本語を入力..." autocomplete="off">
            <br>
            <div class="btn-group">
                <button class="submit-btn" onclick="checkTypedAnswer(false)">回答する</button>
                <button class="skip-btn" onclick="checkTypedAnswer(true)">分からない</button>
            </div>
        `;

    } else if (currentMode === "write") {
        titleElem.textContent = "【上級モード】アラビア語で記述してください";
        qElem.textContent = currentWord.jp;
        qElem.style.direction = "ltr";
        pElem.textContent = ""; 
        correctAnswer = currentWord.ar;

        area.innerHTML = `
            <input type="text" id="user-input" class="input-box" placeholder="アラビア語を入力..." autocomplete="off">
            <br>
            <div class="btn-group">
                <button class="submit-btn" onclick="checkTypedAnswer(false)">回答する</button>
                <button class="skip-btn" onclick="checkTypedAnswer(true)">分からない</button>
            </div>
        `;
    }

    const input = document.getElementById('user-input');
    if (input) {
        input.focus();
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkTypedAnswer(false);
        });
    }
}

window.checkAnswer = function(userAns, btnElement) {
    let isCorrect = (userAns === correctAnswer);
    recordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        if (btnElement && userAns !== null) btnElement.classList.add('wrong');
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';
        allBtns.forEach(b => {
            if (b.textContent === correctAnswer) b.classList.add('correct');
        });
    }

    updateProgress();
    document.getElementById('next-btn').style.display = 'inline-block';
};

window.checkTypedAnswer = function(isSkip) {
    const input = document.getElementById('user-input');
    if (!input) return;
    const val = input.value.trim();
    if (!isSkip && !val) return;

    input.disabled = true;
    let isCorrect = !isSkip && (val === correctAnswer || (currentMode === "translate" && correctAnswer.includes(val)));
    recordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    
    if (currentMode === "write") {
        document.getElementById('pronunciation-word').textContent = `【発音: ${currentWord.pr}】`;
    }

    if (isCorrect) {
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';
    }

    updateProgress();
    document.getElementById('next-btn').style.display = 'inline-block';
};

function recordResult(isCorrect) {
    wordStats[currentIdx].total += 1;
    if (isCorrect) wordStats[currentIdx].correct += 1;
}

document.addEventListener('DOMContentLoaded', () => {
    nextQuestion();
});
</script>
