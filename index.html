<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アラビア語単語・例文クイズ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f5f9;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .quiz-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 440px;
            margin: 10px auto;
        }
        
        /* 理解度の可視化エリア */
        .progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }
        .progress-bar-container {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin: 6px 0;
        }
        .bar-mastered { background: #22c55e; }
        .bar-review { background: #eab308; }
        .bar-weak { background: #ef4444; }
        .bar-unattempted { background: #cbd5e1; }
        .stats-text {
            display: flex;
            justify-content: space-around;
            color: #475569;
            font-weight: bold;
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .page-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .rate-badge {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .rate-high { background-color: #dcfce7; color: #15803d; }
        .rate-mid { background-color: #fef9c3; color: #a16207; }
        .rate-low { background-color: #fee2e2; color: #b91c1c; }

        .mode-title {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 4px;
            margin-top: 10px;
        }
        .question-text {
            font-size: 2.3rem;
            color: #0f172a;
            margin: 10px 0;
            min-height: 55px;
            word-break: break-all;
        }
        .pronunciation-text {
            font-size: 1.1rem;
            color: #0284c7;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .option-btn.pass-btn {
            grid-column: span 2;
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #cbd5e1;
        }
        .option-btn:hover { background-color: #f8fafc; }
        .option-ar { font-size: 1.15rem; line-height: 1.5; }
        .option-pr { direction: ltr; font-size: 0.85rem; color: #0284c7; margin-top: 3px; font-weight: normal; }
        .answer-review {
            margin-top: 12px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            text-align: left;
        }
        .answer-review-title { font-weight: bold; margin-bottom: 8px; color: #334155; }
        .answer-review-question { margin-bottom: 8px; }
        .answer-review-item { padding: 6px 8px; border-radius: 6px; margin: 4px 0; }
        .answer-review-item.correct-answer { background: #dcfce7; }
        .answer-review-item.selected-wrong { background: #fee2e2; }
        .answer-review-ar { direction: rtl; font-size: 1.05rem; font-weight: bold; }
        .answer-review-pr { direction: ltr; color: #0284c7; font-size: 0.8rem; }
        .answer-review-jp { color: #475569; font-size: 0.9rem; }
        .option-btn.correct { background-color: #22c55e !important; color: white !important; border-color: #16a34a !important; }
        .option-btn.wrong { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }

        .input-box {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn {
            padding: 10px 20px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .skip-btn {
            padding: 10px 16px;
            background-color: #64748b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 30px;
        }
        .next-btn {
            margin-top: 15px;
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .mode-select-container {
            margin-bottom: 15px;
            text-align: left;
        }
        .mode-select-container .filter-label {
            display: block;
            font-size: 0.85rem;
            color: #475569;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .page-select {
            width: 100%;
            padding: 9px 10px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 0.95rem;
        }
        .sentence-answer {
            margin-top: 10px;
            font-size: 1.45rem;
            font-weight: bold;
            direction: rtl;
            min-height: 35px;
        }
        .sentence-pronunciation {
            margin-top: 5px;
            color: #0284c7;
            font-weight: bold;
            min-height: 25px;
        }
        .adjective-pair-note { margin: 8px 0 12px; font-weight: bold; color: #475569; }
        .adjective-pair { border: 2px solid #cbd5e1; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .adjective-pair-ar { font-size: 1.5rem; direction: rtl; font-weight: bold; }
        .adjective-pair-pr { color: #0284c7; font-size: 0.9rem; }

        .shadowing-card {
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            padding: 18px;
            margin-top: 10px;
            background: #f8fafc;
        }
        .shadowing-arabic {
            font-size: 2rem;
            font-weight: bold;
            direction: rtl;
            margin: 8px 0;
        }
        .shadowing-pronunciation {
            color: #0284c7;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 14px;
        }
        .shadowing-btn {
            margin: 5px;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="quiz-container">
    <div class="mode-select-container">
        <span class="filter-label">📝 テストモード</span>
        <select id="quiz-mode-select" class="page-select" onchange="onQuizModeChange()">

            <option value="genres">ジャンル別単語テスト</option>
            <option value="verbs">基本動詞テスト</option>
            <option value="adjectives">形容詞テスト</option>
            <option value="questions">5W1H疑問詞テスト</option>
            <option value="sentences">例文テスト</option>
            <option value="shadowing">シャドーイング → 単語テスト</option>
        </select>
    </div>

    <div class="mode-select-container" id="word-genre-container" style="display:none">
        <span class="filter-label">🗂 ジャンル</span>
        <select id="word-genre-select" class="page-select" onchange="onWordGenreChange()">
            <option value="all">すべてのジャンル</option>
        </select>
    </div>

    <div class="mode-select-container" id="word-scope-container">
        <span class="filter-label">📚 出題範囲</span>
        <select id="word-scope-select" class="page-select" onchange="onWordScopeChange()">
            <option value="all">全ページ（P.1–36）</option>
            <option value="section:1-5">P.1–5</option>
            <option value="section:6-10">P.6–10</option>
            <option value="section:11-15">P.11–15</option>
            <option value="section:16-20">P.16–20</option>
            <option value="section:21-25">P.21–25</option>
            <option value="section:26-30">P.26–30</option>
            <option value="section:31-35">P.31–35</option>
        </select>
        <select id="word-page-select" class="page-select" onchange="onWordScopeChange()" style="margin-top:8px">
            <option value="all">ページ指定：すべて</option>
        </select>
    </div>

    <div class="badge-container">
        <span class="page-badge" id="page-badge">P.1</span>
        <span class="rate-badge rate-low" id="rate-badge">未判定</span>
    </div>

    <div class="mode-title" id="mode-title">出題モード</div>
    <div class="question-text" id="question-word">...</div>
    <div class="pronunciation-text" id="pronunciation-word"></div>

    <div id="interactive-area"></div>

    <div class="feedback" id="feedback-msg"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ ➔</button>
</div>

    <!-- 理解度の可視化バー -->
    <div class="progress-box">

            <span id="master-percent">0%</span>
        </div>
        <div class="progress-bar-container">
            <div id="bar-mastered" class="bar-mastered" style="width: 0%"></div>
            <div id="bar-review" class="bar-review" style="width: 0%"></div>
            <div id="bar-weak" class="bar-weak" style="width: 0%"></div>
            <div id="bar-unattempted" class="bar-unattempted" style="width: 100%"></div>
        </div>
        <div class="stats-text">
            <span>未挑戦: <span id="count-unattempted">355</span></span>
            <span>苦手: <span id="count-weak">0</span></span>
            <span>復習: <span id="count-review">0</span></span>
            <span>習得: <span id="count-mastered">0</span></span>
        </div>

        <div style="margin-top: 10px;">
            <button class="skip-btn" onclick="resetProgress()">学習履歴をリセット</button>
        </div>
    </div>

// アラビア語表示用：発音情報からハラカを補って表示する。語尾の格変化までは付けず、学習用の基本形を表示する。
function vocalizeArabic(ar, pr) {
    if (!ar) return ar;
    if (HARAKAT_OVERRIDES[ar]) return HARAKAT_OVERRIDES[ar];
    if (/[\u064B-\u065F\u0670]/.test(ar)) return ar;
    const map = { 'ب':'b','ت':'t','ث':'th','ج':'j','ح':'ḥ','خ':'kh','د':'d','ذ':'dh','ر':'r','ز':'z','س':'s','ش':'sh','ص':'ṣ','ض':'ḍ','ط':'ṭ','ظ':'ẓ','ع':'ʿ','غ':'gh','ف':'f','ق':'q','ك':'k','ل':'l','م':'m','ن':'n','ه':'h','و':'w','ي':'y','ء':'ʾ' };
    const marks = {a:'َ',i:'ِ',u:'ُ'};
    let roman = String(pr || '').toLowerCase()
        .replace(/[’']/g,'ʾ').replace(/aa/g,'ā').replace(/ii/g,'ī').replace(/uu/g,'ū')
        .replace(/[\s\-\/]+/g,'');
    const chars = Array.from(ar);
    let out = '';
    let pos = 0;
    const starts = x => roman.slice(pos, pos+x.length) === x;
    const consume = x => { if(starts(x)){pos+=x.length;return true;} return false; };
    const vowel = () => {
        if(starts('ā')) { pos++; return 'a'; }
        if(starts('ī')) { pos++; return 'i'; }
        if(starts('ū')) { pos++; return 'u'; }
        if(starts('a')) { pos++; return 'a'; }
        if(starts('i')) { pos++; return 'i'; }
        if(starts('u')) { pos++; return 'u'; }
        return '';
    };
    for(let i=0;i<chars.length;i++) {
        const ch=chars[i];
        if(ch===' ') { out+=' '; continue; }
        if(ch==='ة') { if(starts('h')) pos++; out+=ch; continue; }
        if(ch==='ا') {
            if(starts('ā')) { pos++; out+=ch; }
            else if(starts('a')) { pos++; out+=ch+'َ'; }
            else out+=ch;
            continue;
        }
        if(ch==='أ' || ch==='إ' || ch==='آ') {
            if(starts('ʾ')) pos++;
            if(ch==='آ' || starts('ā')) { if(starts('ā')) pos++; out+=ch; }
            else { const v=vowel(); out+=ch+(v?marks[v]:''); }
            continue;
        }
        if((ch==='و' || ch==='ي') && !starts(map[ch])) { out+=ch; continue; }
        const tok=map[ch];
        if(!tok) { out+=ch; continue; }
        // 子音を消費
        if(starts(tok)) pos+=tok.length;
        // 子音がローマ字で直後に重複している場合だけシャッダ
        let doubled = roman.slice(pos).startsWith(tok) && tok.length>0;
        // 長母音・短母音。ay/aw は最初の子音に fatḥa を付け、y/w は次の文字で処理する。
        let v='';
        if(starts('ā')) { pos++; v='a'; }
        else if(starts('ī')) { pos++; v='i'; }
        else if(starts('ū')) { pos++; v='u'; }
        else if(starts('ay') || starts('aw')) { pos++; v='a'; }
        else if(starts('a')) { pos++; v='a'; }
        else if(starts('i')) { pos++; v='i'; }
        else if(starts('u')) { pos++; v='u'; }
        out+=ch+(v?marks[v]:'')+(doubled?'ّ':(!v && i<chars.length-1 && chars[i+1]!==' ' ? 'ْ':''));
    }
    return out;
}

let wordStats = {};
let verbStats = {};
let adjectiveStats = {};
let questionStats = {};
let sentenceStats = {};

function initStats() {
    wordStats = {};
    words.forEach((_, index) => { wordStats[index] = { correct: 0, total: 0 }; });
    verbStats = {};
    basicVerbs.forEach((_, index) => { verbStats[index] = { correct: 0, total: 0 }; });
    adjectiveStats = {};
    adjectives.flat().forEach(w => { const idx=words.indexOf(w); adjectiveStats[idx] = { correct: 0, total: 0 }; });
    questionStats = {};
    questionWords.forEach((_, index) => { questionStats[index] = { correct: 0, total: 0 }; });
    sentenceStats = {};
    sentences.forEach((_, index) => { sentenceStats[index] = { correct: 0, total: 0 }; });
}

function loadProgress() {
    try {
        const savedWords = localStorage.getItem(WORD_STORAGE_KEY);
        const savedSentences = localStorage.getItem(SENTENCE_STORAGE_KEY);
        const savedVerbs = localStorage.getItem(VERB_STORAGE_KEY);
        const savedAdjectives = localStorage.getItem(ADJECTIVE_STORAGE_KEY);
        const savedQuestions = localStorage.getItem(QUESTION_STORAGE_KEY);

        if (savedWords) {
            const parsed = JSON.parse(savedWords);
            words.forEach((_, index) => {
                if (parsed[index]) {
                    wordStats[index] = {
                        correct: Number(parsed[index].correct) || 0,
                        total: Number(parsed[index].total) || 0
                    };
                }
            });
        }

        if (savedSentences) {
            const parsed = JSON.parse(savedSentences);
            sentences.forEach((_, index) => {
                if (parsed[index]) {
                    sentenceStats[index] = {
                        correct: Number(parsed[index].correct) || 0,
                        total: Number(parsed[index].total) || 0
                    };
                }
            });
        }
        if (savedVerbs) {
            const parsed = JSON.parse(savedVerbs);
            basicVerbs.forEach((_, index) => {
                if (parsed[index]) verbStats[index] = { correct: Number(parsed[index].correct) || 0, total: Number(parsed[index].total) || 0 };
            });
        }
        if (savedAdjectives) {
            const parsed = JSON.parse(savedAdjectives);
            Object.keys(adjectiveStats).forEach(index => {
                if (parsed[index]) adjectiveStats[index] = { correct: Number(parsed[index].correct) || 0, total: Number(parsed[index].total) || 0 };
            });
        }
        if (savedQuestions) {
            const parsed = JSON.parse(savedQuestions);
            questionWords.forEach((_, index) => {
                if (parsed[index]) questionStats[index] = { correct: Number(parsed[index].correct) || 0, total: Number(parsed[index].total) || 0 };
            });
        }
    } catch (e) {
        console.warn("進捗データの読み込みに失敗しました:", e);
    }
}

function saveProgress() {
    try {
        localStorage.setItem(WORD_STORAGE_KEY, JSON.stringify(wordStats));
        localStorage.setItem(SENTENCE_STORAGE_KEY, JSON.stringify(sentenceStats));
        localStorage.setItem(VERB_STORAGE_KEY, JSON.stringify(verbStats));
    localStorage.setItem(ADJECTIVE_STORAGE_KEY, JSON.stringify(adjectiveStats));
        localStorage.setItem(QUESTION_STORAGE_KEY, JSON.stringify(questionStats));
    } catch (e) {
        console.warn("進捗データの保存に失敗しました:", e);
    }
}

function getScopedWordIndices() {
    if (wordScope === "all") return words.map((_, i) => i);
    if (wordScope.startsWith("page:")) {
        const p = Number(wordScope.split(":")[1]);
        return words.map((w, i) => w.p === p ? i : -1).filter(i => i >= 0);
    }
    if (wordScope.startsWith("section:")) {
        const [a,b] = wordScope.split(":")[1].split("-").map(Number);
        return words.map((w, i) => w.p >= a && w.p <= b ? i : -1).filter(i => i >= 0);
    }
    return words.map((_, i) => i);
}

function populateGenreSelector() {
    const select=document.getElementById('word-genre-select');
    if(!select) return;
    const old=select.value;
    select.innerHTML='<option value="all">すべてのジャンル</option>';

function populatePageSelector() {

    select.innerHTML = '<option value="all">ページ指定：すべて</option>';

function getActiveWordIndices() {
    return quizMode === 'genres' ? getGenreWordIndices() : getScopedWordIndices();
}

function getCurrentStats() {
    if (quizMode === "sentences") return sentenceStats;
    if (quizMode === "verbs") return verbStats;
    if (quizMode === "adjectives") return adjectiveStats;
    if (quizMode === "questions") return questionStats;
    return wordStats;
}

function updateProgress() {
    const stats = getCurrentStats();
    const indices = quizMode === "sentences" ? sentences.map((_,i)=>i) : quizMode === "verbs" ? basicVerbs.map((_,i)=>i) : quizMode === "adjectives" ? Object.keys(adjectiveStats).map(Number) : quizMode === "questions" ? questionWords.map((_,i)=>i) : getActiveWordIndices();
    const totalItems = indices.length || 1;
    let unattempted=0, weak=0, review=0, mastered=0;
    indices.forEach(i => {
        const stat=stats[i];
        if (stat.total===0) unattempted++;
        else { const rate=stat.correct/stat.total; if(rate<0.4) weak++; else if(rate<0.8) review++; else mastered++; }
    });
    document.getElementById('count-unattempted').textContent=unattempted;
    document.getElementById('count-weak').textContent=weak;
    document.getElementById('count-review').textContent=review;
    document.getElementById('count-mastered').textContent=mastered;
    document.getElementById('bar-unattempted').style.width=`${unattempted/totalItems*100}%`;
    document.getElementById('bar-weak').style.width=`${weak/totalItems*100}%`;
    document.getElementById('bar-review').style.width=`${review/totalItems*100}%`;
    document.getElementById('bar-mastered').style.width=`${mastered/totalItems*100}%`;
    document.getElementById('master-percent').textContent=`${Math.round(mastered/totalItems*100)}%`;
}

function pickWeightedIndex(items, stats, allowedIndices=null) {
    const indices=allowedIndices || items.map((_,i)=>i);
    const weighted=[];
    indices.forEach(idx=>{
        const stat=stats[idx]; const rate=stat.total===0?0:stat.correct/stat.total;
        const weight=Math.max(1,Math.ceil((1.1-rate)*10));
        for(let i=0;i<weight;i++) weighted.push(idx);
    });
    return weighted[Math.floor(Math.random()*weighted.length)];
}

window.nextQuestion=function(){
    if(quizMode==="genres") return nextWordQuestion();
    if(quizMode==="verbs") return nextBasicWordQuestion(basicVerbs, verbStats, "基本動詞テスト");
    if(quizMode==="adjectives") return nextAdjectiveQuestion();
    if(quizMode==="questions") return nextBasicWordQuestion(questionWords, questionStats, "5W1H疑問詞テスト");
    if(quizMode==="sentences") return nextSentenceQuestion();
    if(quizMode==="shadowing") return nextShadowingQuestion();
    return nextWordQuestion();
};

function nextAdjectiveQuestion(){
    updateProgress();
    // 各ペアを1問として扱い、ペア内の2語を連続して出題する。
    if (typeof adjectivePairOrder === 'undefined' || adjectivePairOrder.length === 0 || adjectivePairPos >= adjectivePairOrder.length) {
        adjectivePairOrder = adjectives.map((_,i)=>i).sort(()=>Math.random()-0.5);
        adjectivePairPos = 0;
        adjectiveSide = 0;
    }
    const pairIndex = adjectivePairOrder[adjectivePairPos];
    const pair = adjectives[pairIndex];
    const word = pair[adjectiveSide];
    currentIdx = words.indexOf(word);
    currentWord = word;
    const stat = adjectiveStats[currentIdx] || {correct:0,total:0};
    const rate = stat.total===0 ? -1 : stat.correct/stat.total;
    const badge=document.getElementById('rate-badge');
    currentMode="choice";
    badge.textContent=rate===-1?"未挑戦 (4択)":`正答率 ${(rate*100).toFixed(0)}% (4択)`;
    badge.className=`rate-badge ${rate>=0.8?'rate-high':rate>0.75?'rate-mid':'rate-low'}`;
    updateModeUI(); clearQuestionArea(); setupAdjectiveUI();
    document.getElementById('mode-title').textContent=`【形容詞テスト・${adjectiveSide===0?'対義語1/2':'対義語2/2'}】`;
}

let adjectivePairOrder=[];
let adjectivePairPos=0;
let adjectiveSide=0;

function nextBasicWordQuestion(bank, stats, label){
    updateProgress();
    const idxs=bank.map((_,i)=>i);
    currentIdx=pickWeightedIndex(bank,stats,idxs);
    currentWord=bank[currentIdx];
    const stat=stats[currentIdx]; const rate=stat.total===0?-1:stat.correct/stat.total;
    const badge=document.getElementById('rate-badge');
    if(rate===-1){currentMode="choice";badge.textContent="未挑戦 (4択)";badge.className="rate-badge rate-low";}
    else if(rate<0.4){currentMode="choice";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (4択)`;badge.className="rate-badge rate-low";}
    else if(rate<0.8){currentMode="translate";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (日本語入力)`;badge.className="rate-badge rate-mid";}
    else {currentMode="write";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (アラビア語入力)`;badge.className="rate-badge rate-high";}
    updateModeUI(); clearQuestionArea(); setupBasicWordUI(label,bank);
}

    q.textContent=currentWord.jp; q.style.direction='ltr'; p.textContent=''; correctAnswer=currentWord.ar;
    const pair = adjectives[adjectivePairOrder[adjectivePairPos]];
    const other = pair.find(w=>w!==currentWord);
    const note=document.createElement('div'); note.className='adjective-pair-note'; note.textContent=`対となる形容詞：${other.jp}`; area.appendChild(note);
    const choices=[currentWord.ar];
    const allAdjs=adjectives.flat();
    while(choices.length<4){ const c=allAdjs[Math.floor(Math.random()*allAdjs.length)].ar; if(!choices.includes(c)) choices.push(c); }
    choices.sort(()=>Math.random()-0.5);

window.checkAdjectiveAnswer=function(userAns,btnElement){
    const isCorrect=userAns===correctAnswer;
    adjectiveStats[currentIdx] ||= {correct:0,total:0};
    adjectiveStats[currentIdx].total++; if(isCorrect) adjectiveStats[currentIdx].correct++; saveProgress();

    if(isCorrect){btnElement?.classList.add('correct');feedback.textContent='正解！';feedback.style.color='#16a34a';}
    else{if(btnElement&&userAns!==null)btnElement.classList.add('wrong');feedback.textContent=`❌ 正解は「${currentWord.jp}」`;feedback.style.color='#dc2626';allBtns.forEach(b=>{if(b.dataset.answer===correctAnswer)b.classList.add('correct');});}
    const pair=adjectives[adjectivePairOrder[adjectivePairPos]]; const other=pair.find(w=>w!==currentWord);
    const review=document.createElement('div');review.className='answer-review';
    review.innerHTML=`<div class="answer-review-title">答え合わせ</div><div class="answer-review-question">問題：${currentWord.jp}</div><div class="answer-review-item correct-answer"><div class="answer-review-ar">${vocalizeArabic(currentWord.ar,currentWord.pr)}</div><div class="answer-review-pr">${currentWord.pr}</div><div class="answer-review-jp">意味：${currentWord.jp}</div></div><div class="answer-review-item"><div class="answer-review-ar">${vocalizeArabic(other.ar,other.pr)}</div><div class="answer-review-pr">${other.pr}</div><div class="answer-review-jp">対語：${other.jp}</div></div>`;
    document.getElementById('interactive-area').appendChild(review);

};

function setupBasicWordUI(label,bank){

        const pass=document.createElement('button');pass.className='option-btn pass-btn';pass.textContent='❓ 分からない (パス)';pass.onclick=()=>checkBasicWordAnswer(null,pass);grid.appendChild(pass);area.appendChild(grid);
    } else if(currentMode==='translate'){

        area.innerHTML='<input type="text" id="user-input" class="input-box" placeholder="日本語を入力..." autocomplete="off"><br><div class="btn-group"><button class="submit-btn" onclick="checkBasicTypedAnswer(false)">回答する</button><button class="skip-btn" onclick="checkBasicTypedAnswer(true)">分からない</button></div>';
    } else {

    const input=document.getElementById('user-input');

}

window.checkBasicWordAnswer=function(userAns,btnElement){
    const isCorrect=userAns===correctAnswer;
    recordBasicResult(isCorrect);
    const feedback=document.getElementById('feedback-msg'), allBtns=document.querySelectorAll('.option-btn');

    if(isCorrect){if(btnElement)btnElement.classList.add('correct');feedback.textContent='正解！';feedback.style.color='#16a34a';}
    else{if(btnElement&&userAns!==null)btnElement.classList.add('wrong');feedback.textContent=`❌ 正解は「${currentWord.jp}」`;feedback.style.color='#dc2626';allBtns.forEach(b=>{if(b.textContent===correctAnswer)b.classList.add('correct');});}
    document.getElementById('pronunciation-word').textContent=`【発音: ${currentWord.pr}】`;
    document.getElementById('question-word').textContent=vocalizeArabic(currentWord.ar, currentWord.pr);

window.checkBasicTypedAnswer=function(isSkip){
    const input=document.getElementById('user-input'); if(!input)return;
    const val=input.value.trim(); if(!isSkip&&!val)return; input.disabled=true;
    const isCorrect=!isSkip&&(val===correctAnswer||(currentMode==='translate'&&correctAnswer.includes(val)));
    recordBasicResult(isCorrect);
    const feedback=document.getElementById('feedback-msg');
    if(currentMode==='write')document.getElementById('pronunciation-word').textContent=`【発音: ${currentWord.pr}】`;
    feedback.textContent=isCorrect?'正解！':`❌ 正解は「${correctAnswer}」`; feedback.style.color=isCorrect?'#16a34a':'#dc2626';
    updateProgress(); const nextBtn=document.getElementById('next-btn'); nextBtn.textContent='次の問題へ ➔'; nextBtn.onclick=nextQuestion; nextBtn.style.display='inline-block'; scrollToAnswerBottom();
};

function nextWordQuestion(){
    updateProgress();
    const ids=getActiveWordIndices();
    if(!ids.length) return;
    currentIdx=pickWeightedIndex(words,wordStats,ids);
    currentWord=words[currentIdx];
    const stat=wordStats[currentIdx]; const rate=stat.total===0?-1:stat.correct/stat.total;
    const badge=document.getElementById('rate-badge');
    if(rate===-1){currentMode="choice";badge.textContent="未挑戦 (4択)";badge.className="rate-badge rate-low";}
    else if(rate<=0.75){currentMode="choice";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (4択)`;badge.className="rate-badge rate-low";}
    else if(rate<0.8){currentMode="translate";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (日本語入力)`;badge.className="rate-badge rate-mid";}
    else {currentMode="write";badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (アラビア語入力)`;badge.className="rate-badge rate-high";}
    updateModeUI(); clearQuestionArea(); setupWordUI();
}

function nextSentenceQuestion(){
    updateProgress();
    currentSentenceIdx=pickWeightedIndex(sentences,sentenceStats);
    currentSentence=sentences[currentSentenceIdx];
    const stat=sentenceStats[currentSentenceIdx]; const rate=stat.total===0?-1:stat.correct/stat.total;
    const badge=document.getElementById('rate-badge');
    badge.textContent=rate===-1?"未挑戦 (4択)":`正答率 ${(rate*100).toFixed(0)}% (4択)`;
    badge.className=`rate-badge ${rate>=0.8?'rate-high':rate>0.75?'rate-mid':'rate-low'}`;
    updateModeUI(); clearQuestionArea();
    const q=document.getElementById('question-word'), p=document.getElementById('pronunciation-word'), title=document.getElementById('mode-title'), area=document.getElementById('interactive-area');
    title.textContent="【例文テスト】英語に対応するアラビア語を選んでください";
    q.textContent=currentSentence.en; q.style.direction="ltr"; p.textContent=""; correctAnswer=currentSentence.ar;
    const choices=[currentSentence.ar];
    while(choices.length<4){const c=sentences[Math.floor(Math.random()*sentences.length)].ar;if(!choices.includes(c))choices.push(c);}
    choices.sort(()=>Math.random()-0.5);
    const grid=document.createElement('div'); grid.className='options-grid';
    choices.forEach(c=>{const b=document.createElement('button');b.className='option-btn';const item=sentences.find(x=>x.ar===c);b.textContent=item?(HARAKAT_OVERRIDES[item.ar]||vocalizeArabic(item.ar,item.pr)):c;b.style.direction='rtl';b.onclick=()=>checkSentenceAnswer(c,b);grid.appendChild(b);});
    const pass=document.createElement('button');pass.className='option-btn pass-btn';pass.textContent='❓ 分からない (パス)';pass.onclick=()=>checkSentenceAnswer(null,pass);grid.appendChild(pass);area.appendChild(grid);
}

function nextShadowingQuestion(){
    updateProgress();
    if (!shadowingBatch.length || shadowingBatchPos >= shadowingBatch.length) {
        if (!shadowingQueue.length || shadowingIndex >= shadowingQueue.length) {
            shadowingQueue=[...getScopedWordIndices()].sort(()=>Math.random()-0.5);
            shadowingIndex=0;
        }
        shadowingBatch=shadowingQueue.slice(shadowingIndex, shadowingIndex+SHADOWING_BATCH_SIZE);
        shadowingBatchPos=0; shadowingTestPos=0; shadowingIndex+=shadowingBatch.length;
    }
    currentIdx=shadowingBatch[shadowingBatchPos]; currentWord=words[currentIdx]; shadowingAwaitingTest=false;
    updateModeUI(); clearQuestionArea();
    const q=document.getElementById('question-word'), p=document.getElementById('pronunciation-word'), title=document.getElementById('mode-title'), area=document.getElementById('interactive-area');
    title.textContent=`【シャドーイング ${shadowingBatchPos+1}/${shadowingBatch.length}】発音を確認して声に出してください`;
    q.textContent=vocalizeArabic(currentWord.ar, currentWord.pr); q.style.direction='rtl'; p.textContent=`【発音: ${currentWord.pr}】`;
    const card=document.createElement('div'); card.className='shadowing-card';
    card.innerHTML=`<div class="shadowing-arabic">${vocalizeArabic(currentWord.ar, currentWord.pr)}</div><div class="shadowing-meaning">意味：${currentWord.jp}</div><div class="shadowing-pronunciation">${currentWord.pr}</div>`;
    const done=document.createElement('button'); done.className='shadowing-btn option-btn'; done.textContent=shadowingBatchPos+1<shadowingBatch.length?'シャドーイング完了 → 次の単語':'シャドーイング完了 → テスト開始'; done.onclick=completeShadowingWord;
    card.appendChild(done); area.appendChild(card);
}

function completeShadowingWord(){
    shadowingBatchPos++;
    if(shadowingBatchPos<shadowingBatch.length) nextShadowingQuestion();
    else { shadowingTestPos=0; startShadowingBatchTest(); }
}

function startShadowingBatchTest(){
    shadowingAwaitingTest=true; currentIdx=shadowingBatch[shadowingTestPos]; currentWord=words[currentIdx];
    const stat=wordStats[currentIdx], rate=stat.total===0?-1:stat.correct/stat.total, badge=document.getElementById('rate-badge');
    if(rate===-1){currentMode='choice';badge.textContent='未挑戦 (4択)';badge.className='rate-badge rate-low';}
    else if(rate<=0.75){currentMode='choice';badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (4択)`;badge.className='rate-badge rate-low';}
    else if(rate<0.8){currentMode='translate';badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (日本語入力)`;badge.className='rate-badge rate-mid';}
    else {currentMode='write';badge.textContent=`正答率 ${(rate*100).toFixed(0)}% (アラビア語入力)`;badge.className='rate-badge rate-high';}
    clearQuestionArea(); setupWordUI(); document.getElementById('mode-title').textContent=`【シャドーイング後テスト ${shadowingTestPos+1}/${shadowingBatch.length}】`;
}

function finishShadowingItem(){
    shadowingTestPos++;
    if(shadowingTestPos<shadowingBatch.length) startShadowingBatchTest();
    else { shadowingBatch=[]; shadowingBatchPos=0; shadowingTestPos=0; nextQuestion(); }
}

function clearQuestionArea(){
    document.getElementById('question-word').textContent='...';
    document.getElementById('pronunciation-word').textContent='';
    document.getElementById('interactive-area').innerHTML='';
    document.getElementById('feedback-msg').textContent='';
    document.getElementById('feedback-msg').style.color='';
    document.getElementById('next-btn').style.display='none';
}

    const q=document.getElementById('question-word'), p=document.getElementById('pronunciation-word'), title=document.getElementById('mode-title'), area=document.getElementById('interactive-area');
    area.innerHTML='';
    const imageWrap=document.createElement('div'); imageWrap.className='word-image-wrap';

        const pass=document.createElement('button');pass.className='option-btn pass-btn';pass.textContent='❓ 分からない (パス)';pass.onclick=()=>checkAnswer(null,pass);grid.appendChild(pass);area.appendChild(grid);

        q.textContent=vocalizeArabic(currentWord.ar, currentWord.pr);q.style.direction='rtl';p.textContent=`【発音: ${currentWord.pr}】`;correctAnswer=currentWord.jp;
        area.innerHTML='<input type="text" id="user-input" class="input-box" placeholder="日本語を入力..." autocomplete="off"><br><div class="btn-group"><button class="submit-btn" onclick="checkTypedAnswer(false)">回答する</button><button class="skip-btn" onclick="checkTypedAnswer(true)">分からない</button></div>';
    } else {
        title.textContent=title.textContent.includes('シャドーイング')?'【シャドーイング後テスト・上級】アラビア語で記述してください':'【上級モード】アラビア語で記述してください';
        q.textContent=currentWord.jp;q.style.direction='ltr';p.textContent='';correctAnswer=currentWord.ar;
        area.innerHTML='<input type="text" id="user-input" class="input-box" placeholder="アラビア語を入力..." autocomplete="off" dir="rtl"><br><div class="btn-group"><button class="submit-btn" onclick="checkTypedAnswer(false)">回答する</button><button class="skip-btn" onclick="checkTypedAnswer(true)">分からない</button></div>';
    }
    const input=document.getElementById('user-input');
    if(input){input.focus();input.addEventListener('keypress',e=>{if(e.key==='Enter')checkTypedAnswer(false);});}

function scrollToAnswerBottom(){
    requestAnimationFrame(()=>{
        const nextBtn=document.getElementById('next-btn');
        if(nextBtn) nextBtn.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
        else window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    });
}

window.checkAnswer = function(userAns, btnElement) {
    const isCorrect = (userAns === correctAnswer);
    recordWordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    const allBtns = document.querySelectorAll('#interactive-area .option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        if (btnElement && userAns !== null) btnElement.classList.add('wrong');
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';
        allBtns.forEach(b => {
            if (b.dataset.answer === correctAnswer) b.classList.add('correct');
        });
    }

    // 答え合わせ：問題文と、4つの選択肢すべての日本語訳を表示
    const oldReview = document.getElementById('answer-review');
    if (oldReview) oldReview.remove();
    const review = document.createElement('div');
    review.id = 'answer-review';
    review.className = 'answer-review';
    const title = document.createElement('div');
    title.className = 'answer-review-title';
    title.textContent = '答え合わせ';
    review.appendChild(title);
    const question = document.createElement('div');
    question.className = 'answer-review-question';
    question.textContent = `問題：${currentWord.jp}`;
    review.appendChild(question);

    allBtns.forEach(b => {
        const ar = b.dataset.answer;
        if (!ar) return;
        const item = words.find(x => x.ar === ar);
        if (!item) return;
        const row = document.createElement('div');
        row.className = 'answer-review-item' + (ar === correctAnswer ? ' correct-answer' : '') + (ar === userAns && !isCorrect ? ' selected-wrong' : '');
        const arEl = document.createElement('div');
        arEl.className = 'answer-review-ar';
        arEl.textContent = vocalizeArabic(item.ar, item.pr || '');
        const prEl = document.createElement('div');
        prEl.className = 'answer-review-pr';
        prEl.textContent = item.pr || '';
        const jpEl = document.createElement('div');
        jpEl.className = 'answer-review-jp';
        jpEl.textContent = `意味：${item.jp}`;
        row.appendChild(arEl); row.appendChild(prEl); row.appendChild(jpEl);
        review.appendChild(row);
    });
    document.getElementById('interactive-area').appendChild(review);

    document.getElementById('pronunciation-word').textContent = `【発音: ${currentWord.pr}】`;
    // 問題は答え合わせ後も日本語のまま表示
    document.getElementById('question-word').textContent = currentWord.jp;
    document.getElementById('question-word').style.direction = 'ltr';
    updateProgress();
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = quizMode === 'shadowing' ? '次のシャドーイングへ ➔' : '次の問題へ ➔';
    nextBtn.onclick = quizMode === 'shadowing' ? finishShadowingItem : nextQuestion;
    nextBtn.style.display = 'inline-block';
    scrollToAnswerBottom();
};

window.checkSentenceAnswer = function(userAns, btnElement) {
    const isCorrect = (userAns === correctAnswer);
    recordSentenceResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        if (btnElement && userAns !== null) btnElement.classList.add('wrong');
        feedback.textContent = `❌ 正解は「${HARAKAT_OVERRIDES[currentSentence.ar] || vocalizeArabic(currentSentence.ar, currentSentence.pr)}」`;
        feedback.style.color = '#dc2626';

        allBtns.forEach(b => {
            if (b.textContent === (HARAKAT_OVERRIDES[currentSentence.ar] || vocalizeArabic(currentSentence.ar, currentSentence.pr))) b.classList.add('correct');
        });
    }

    document.getElementById('pronunciation-word').textContent =
        `【発音: ${currentSentence.pr}】`;

    updateProgress();
    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = '次の問題へ ➔';
    nextBtn.onclick = nextQuestion;
    nextBtn.style.display = 'inline-block';
    scrollToAnswerBottom();
};

window.checkTypedAnswer = function(isSkip) {
    const input = document.getElementById('user-input');
    if (!input) return;

    const val = input.value.trim();
    if (!isSkip && !val) return;

    input.disabled = true;

    const isCorrect =
        !isSkip &&
        (val === correctAnswer ||
        (currentMode === "translate" && correctAnswer.includes(val)));

    recordWordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');

    if (currentMode === "write") {
        document.getElementById('pronunciation-word').textContent =
            `【発音: ${currentWord.pr}】`;
    }

    if (isCorrect) {
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';
    }

    updateProgress();
    if (quizMode === 'shadowing') {
        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = '次のシャドーイングへ ➔';
        nextBtn.onclick = finishShadowingItem;
    } else {
        const nextBtn = document.getElementById('next-btn');
        nextBtn.textContent = '次の問題へ ➔';
        nextBtn.onclick = nextQuestion;
    }
    document.getElementById('next-btn').style.display = 'inline-block';
    scrollToAnswerBottom();
};

function recordBasicResult(isCorrect) {
    const stats = quizMode === "verbs" ? verbStats : questionStats;
    stats[currentIdx].total += 1;
    if (isCorrect) stats[currentIdx].correct += 1;
    saveProgress();
}

function recordAdjectiveResult(isCorrect){ adjectiveStats[currentAdjectiveIndex].total+=1; if(isCorrect) adjectiveStats[currentAdjectiveIndex].correct+=1; saveProgress(); }
function scrollAnswerIntoView(){ const nextBtn=document.getElementById('next-btn'); if(nextBtn) requestAnimationFrame(()=>nextBtn.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})); }

function recordWordResult(isCorrect) {
    wordStats[currentIdx].total += 1;
    if (isCorrect) wordStats[currentIdx].correct += 1;
    saveProgress();
}

function recordSentenceResult(isCorrect) {
    sentenceStats[currentSentenceIdx].total += 1;
    if (isCorrect) sentenceStats[currentSentenceIdx].correct += 1;
    saveProgress();
}

document.addEventListener('DOMContentLoaded', () => {
    initStats();
    loadProgress();
    populatePageSelector();
    populateGenreSelector();
    updateScopeUI();
    updateProgress();
    nextQuestion();
});
