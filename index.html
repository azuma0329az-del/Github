<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アラビア語単語・例文クイズ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f1f5f9;
            padding: 15px;
            text-align: center;
            margin: 0;
        }
        .quiz-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 440px;
            margin: 10px auto;
        }
        
        /* 理解度の可視化エリア */
        .progress-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.8rem;
        }
        .progress-bar-container {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            margin: 6px 0;
        }
        .bar-mastered { background: #22c55e; }
        .bar-review { background: #eab308; }
        .bar-weak { background: #ef4444; }
        .bar-unattempted { background: #cbd5e1; }
        .stats-text {
            display: flex;
            justify-content: space-around;
            color: #475569;
            font-weight: bold;
        }

        .badge-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .page-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .rate-badge {
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .rate-high { background-color: #dcfce7; color: #15803d; }
        .rate-mid { background-color: #fef9c3; color: #a16207; }
        .rate-low { background-color: #fee2e2; color: #b91c1c; }

        .mode-title {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: bold;
            margin-bottom: 4px;
            margin-top: 10px;
        }
        .question-text {
            font-size: 2.3rem;
            color: #0f172a;
            margin: 10px 0;
            min-height: 55px;
            word-break: break-all;
        }
        .pronunciation-text {
            font-size: 1.1rem;
            color: #0284c7;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 25px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background-color: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .option-btn.pass-btn {
            grid-column: span 2;
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #cbd5e1;
        }
        .option-btn:hover { background-color: #f8fafc; }
        .option-btn.correct { background-color: #22c55e !important; color: white !important; border-color: #16a34a !important; }
        .option-btn.wrong { background-color: #ef4444 !important; color: white !important; border-color: #dc2626 !important; }

        .input-box {
            width: 80%;
            padding: 10px;
            font-size: 1.2rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .submit-btn {
            padding: 10px 20px;
            background-color: #0d9488;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .skip-btn {
            padding: 10px 16px;
            background-color: #64748b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 30px;
        }
        .next-btn {
            margin-top: 15px;
            padding: 12px 28px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .mode-select-container {
            margin-bottom: 15px;
            text-align: left;
        }
        .mode-select-container .filter-label {
            display: block;
            font-size: 0.85rem;
            color: #475569;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .page-select {
            width: 100%;
            padding: 9px 10px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 0.95rem;
        }
        .sentence-answer {
            margin-top: 10px;
            font-size: 1.45rem;
            font-weight: bold;
            direction: rtl;
            min-height: 35px;
        }
        .sentence-pronunciation {
            margin-top: 5px;
            color: #0284c7;
            font-weight: bold;
            min-height: 25px;
        }

    </style>
</head>

    </div>

        <div class="progress-bar-container">

            <div id="bar-review" class="bar-review" style="width: 0%"></div>
            <div id="bar-weak" class="bar-weak" style="width: 0%"></div>
            <div id="bar-unattempted" class="bar-unattempted" style="width: 100%"></div>
        </div>
        <div class="stats-text">

        </div>

        <div style="margin-top: 10px;">
            <button class="skip-btn" onclick="resetProgress()">学習履歴をリセット</button>
        </div>
    </div>

    <div class="badge-container">

    <div class="pronunciation-text" id="pronunciation-word"></div>

    <div id="interactive-area"></div>

</div>

let wordStats = {};
let sentenceStats = {};

function initStats() {
    wordStats = {};
    words.forEach((_, index) => {
        wordStats[index] = { correct: 0, total: 0 };
    });

    sentenceStats = {};
    sentences.forEach((_, index) => {
        sentenceStats[index] = { correct: 0, total: 0 };
    });
}

function loadProgress() {
    try {
        const savedWords = localStorage.getItem(WORD_STORAGE_KEY);
        const savedSentences = localStorage.getItem(SENTENCE_STORAGE_KEY);

        if (savedWords) {
            const parsed = JSON.parse(savedWords);
            words.forEach((_, index) => {
                if (parsed[index]) {
                    wordStats[index] = {
                        correct: Number(parsed[index].correct) || 0,
                        total: Number(parsed[index].total) || 0
                    };
                }
            });
        }

        if (savedSentences) {
            const parsed = JSON.parse(savedSentences);
            sentences.forEach((_, index) => {
                if (parsed[index]) {
                    sentenceStats[index] = {
                        correct: Number(parsed[index].correct) || 0,
                        total: Number(parsed[index].total) || 0
                    };
                }
            });
        }
    } catch (e) {
        console.warn("進捗データの読み込みに失敗しました:", e);
    }
}

function saveProgress() {
    try {
        localStorage.setItem(WORD_STORAGE_KEY, JSON.stringify(wordStats));
        localStorage.setItem(SENTENCE_STORAGE_KEY, JSON.stringify(sentenceStats));
    } catch (e) {
        console.warn("進捗データの保存に失敗しました:", e);
    }
}

let quizMode = "words";
let currentIdx = null;
let currentWord = null;
let currentSentenceIdx = null;
let currentSentence = null;
let currentMode = "choice";
let correctAnswer = "";

function getCurrentStats() {
    return quizMode === "sentences" ? sentenceStats : wordStats;
}

function updateProgress() {
    const stats = getCurrentStats();
    const totalItems = quizMode === "sentences" ? sentences.length : words.length;

    let unattempted = 0;
    let weak = 0;
    let review = 0;
    let mastered = 0;

    Object.values(stats).forEach(stat => {
        if (stat.total === 0) {
            unattempted++;
        } else {
            const rate = stat.correct / stat.total;
            if (rate < 0.4) weak++;
            else if (rate < 0.8) review++;
            else mastered++;
        }
    });

    document.getElementById('count-unattempted').textContent = unattempted;
    document.getElementById('count-weak').textContent = weak;
    document.getElementById('count-review').textContent = review;
    document.getElementById('count-mastered').textContent = mastered;

    document.getElementById('bar-unattempted').style.width = `${(unattempted / totalItems) * 100}%`;
    document.getElementById('bar-weak').style.width = `${(weak / totalItems) * 100}%`;
    document.getElementById('bar-review').style.width = `${(review / totalItems) * 100}%`;
    document.getElementById('bar-mastered').style.width = `${(mastered / totalItems) * 100}%`;

    const percent = Math.round((mastered / totalItems) * 100);
    document.getElementById('master-percent').textContent = `${percent}%`;
}

    const select = document.getElementById('quiz-mode-select');
    const pageBadge = document.getElementById('page-badge');

    if (quizMode === "sentences") {
        select.value = "sentences";
        pageBadge.textContent = `例文 (${sentences.length}文)`;
    } else if (currentWord) {
        select.value = "words";
        pageBadge.textContent = `P.${currentWord.p} (全${words.length}語)`;
    }
}

window.resetProgress = function() {
    if (!confirm("単語と例文の学習履歴をすべてリセットしますか？")) return;

    initStats();
    saveProgress();
    nextQuestion();
};

function pickWeightedIndex(items, stats) {
    const weightedIndices = [];

    items.forEach((_, idx) => {
        const stat = stats[idx];
        const rate = stat.total === 0 ? 0 : stat.correct / stat.total;
        const weight = Math.max(1, Math.ceil((1.1 - rate) * 10));

        for (let i = 0; i < weight; i++) {
            weightedIndices.push(idx);
        }
    });

    return weightedIndices[Math.floor(Math.random() * weightedIndices.length)];
}

window.nextQuestion = function() {
    if (quizMode === "sentences") {
        nextSentenceQuestion();
        return;
    }

    nextWordQuestion();
};

function nextWordQuestion() {
    updateProgress();

    currentIdx = pickWeightedIndex(words, wordStats);
    currentWord = words[currentIdx];

    const stat = wordStats[currentIdx];
    const rate = stat.total === 0 ? -1 : (stat.correct / stat.total);

    const rateBadge = document.getElementById('rate-badge');

    if (rate === -1) {
        currentMode = "choice";
        rateBadge.textContent = "未挑戦 (4択)";
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.4) {
        currentMode = "choice";
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (4択)`;
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.8) {
        currentMode = "translate";
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (日本語入力)`;
        rateBadge.className = "rate-badge rate-mid";
    } else {
        currentMode = "write";
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (アラビア語入力)`;
        rateBadge.className = "rate-badge rate-high";
    }

    updateModeUI();
    document.getElementById('feedback-msg').textContent = '';
    document.getElementById('feedback-msg').style.color = '';
    document.getElementById('next-btn').style.display = 'none';

    setupWordUI();
}

function nextSentenceQuestion() {
    updateProgress();

    currentSentenceIdx = pickWeightedIndex(sentences, sentenceStats);
    currentSentence = sentences[currentSentenceIdx];

    const stat = sentenceStats[currentSentenceIdx];
    const rate = stat.total === 0 ? -1 : (stat.correct / stat.total);
    const rateBadge = document.getElementById('rate-badge');

    if (rate === -1) {
        rateBadge.textContent = "未挑戦 (4択)";
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.4) {
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (4択)`;
        rateBadge.className = "rate-badge rate-low";
    } else if (rate < 0.8) {
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (4択)`;
        rateBadge.className = "rate-badge rate-mid";
    } else {
        rateBadge.textContent = `正答率 ${(rate * 100).toFixed(0)}% (4択)`;
        rateBadge.className = "rate-badge rate-high";
    }

    updateModeUI();

    const qElem = document.getElementById('question-word');
    const pElem = document.getElementById('pronunciation-word');
    const titleElem = document.getElementById('mode-title');
    const area = document.getElementById('interactive-area');

    titleElem.textContent = "【例文テスト】英語に対応するアラビア語を選んでください";
    qElem.textContent = currentSentence.en;

    area.innerHTML = "";
    document.getElementById('feedback-msg').textContent = "";
    document.getElementById('feedback-msg').style.color = "";
    document.getElementById('next-btn').style.display = 'none';

    correctAnswer = currentSentence.ar;

    const choices = [currentSentence.ar];
    while (choices.length < 4) {
        const candidate = sentences[Math.floor(Math.random() * sentences.length)].ar;
        if (!choices.includes(candidate)) {
            choices.push(candidate);
        }
    }
    choices.sort(() => Math.random() - 0.5);

    const grid = document.createElement('div');
    grid.className = 'options-grid';

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = choice;
        btn.style.direction = "rtl";
        btn.onclick = function() {
            checkSentenceAnswer(choice, btn);
        };
        grid.appendChild(btn);
    });

    const passBtn = document.createElement('button');
    passBtn.className = 'option-btn pass-btn';
    passBtn.textContent = "❓ 分からない (パス)";
    passBtn.onclick = function() {
        checkSentenceAnswer(null, passBtn);
    };
    grid.appendChild(passBtn);

    area.appendChild(grid);
}

        choices.sort(() => Math.random() - 0.5);

        grid.className = 'options-grid';

        choices.forEach(choice => {

window.checkAnswer = function(userAns, btnElement) {
    const isCorrect = (userAns === correctAnswer);
    recordWordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        if (btnElement && userAns !== null) btnElement.classList.add('wrong');
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';

        allBtns.forEach(b => {
            if (b.textContent === correctAnswer) b.classList.add('correct');
        });
    }

    updateProgress();
    document.getElementById('next-btn').style.display = 'inline-block';
};

window.checkSentenceAnswer = function(userAns, btnElement) {
    const isCorrect = (userAns === correctAnswer);
    recordSentenceResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        if (btnElement) btnElement.classList.add('correct');
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        if (btnElement && userAns !== null) btnElement.classList.add('wrong');
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';

        allBtns.forEach(b => {
            if (b.textContent === correctAnswer) b.classList.add('correct');
        });
    }

    document.getElementById('pronunciation-word').textContent =
        `【発音: ${currentSentence.pr}】`;

    updateProgress();
    document.getElementById('next-btn').style.display = 'inline-block';
};

window.checkTypedAnswer = function(isSkip) {
    const input = document.getElementById('user-input');
    if (!input) return;

    const val = input.value.trim();
    if (!isSkip && !val) return;

    input.disabled = true;

    const isCorrect =
        !isSkip &&
        (val === correctAnswer ||
        (currentMode === "translate" && correctAnswer.includes(val)));

    recordWordResult(isCorrect);

    const feedback = document.getElementById('feedback-msg');

    if (currentMode === "write") {
        document.getElementById('pronunciation-word').textContent =
            `【発音: ${currentWord.pr}】`;
    }

    if (isCorrect) {
        feedback.textContent = '正解！';
        feedback.style.color = '#16a34a';
    } else {
        feedback.textContent = `❌ 正解は「${correctAnswer}」`;
        feedback.style.color = '#dc2626';
    }

    updateProgress();
    document.getElementById('next-btn').style.display = 'inline-block';
};

function recordWordResult(isCorrect) {
    wordStats[currentIdx].total += 1;
    if (isCorrect) wordStats[currentIdx].correct += 1;
    saveProgress();
}

function recordSentenceResult(isCorrect) {
    sentenceStats[currentSentenceIdx].total += 1;
    if (isCorrect) sentenceStats[currentSentenceIdx].correct += 1;
    saveProgress();
}

document.addEventListener('DOMContentLoaded', () => {
    initStats();
    loadProgress();
    updateProgress();
    nextQuestion();
});

</script>

</body>
</html>
